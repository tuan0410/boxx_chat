<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friend Chat</title>
<style>
  :root {
    --bg: #e9eef5; --panel: #ffffff; --ink: #1c2434; --muted: #6b7789;
    --accent: #0e7c86; --accent-ink: #ffffff; --bubble: #f0f3f8; --line: #d5dce7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131a26; --panel: #1b2434; --ink: #e6ebf3; --muted: #8b98ad;
            --accent: #3fb6c0; --accent-ink: #0b1a1d; --bubble: #263148; --line: #2e3a52; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 "Trebuchet MS", "Segoe UI", sans-serif; }
  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 720px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--panel); }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  header h1 { margin: 0; font-size: 1.1rem; }
  #online { color: var(--muted); font-size: .85rem; text-align: right; }

  #messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; background: var(--bubble); align-self: flex-start; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
  .msg .who { font-size: .78rem; font-weight: 700; margin-bottom: 2px; opacity: .8; }
  .msg .when { font-size: .7rem; opacity: .65; margin-left: 8px; font-weight: 400; }
  .sys { align-self: center; color: var(--muted); font-size: .8rem; }

  form { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }

  #login { margin: auto; padding: 24px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 10px; }
  #login h2 { margin: 0 0 4px; }
  #err { color: #c0392b; min-height: 1.3em; margin: 0; font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <form id="login">
    <h2>Join the chat</h2>
    <input id="name" placeholder="Your name" maxlength="20" autocomplete="nickname" required>
    <input id="password" type="password" placeholder="Password (if your server has one)" autocomplete="off">
    <p id="err" role="alert"></p>
    <button type="submit">Join</button>
  </form>

  <header hidden id="top"><h1>Friend Chat</h1><div id="online"></div></header>
  <div id="messages" hidden></div>
  <form id="send" hidden>
    <input id="text" placeholder="Type a message" maxlength="1000" autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let myName = "";
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}`);

  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "error") $("err").textContent = m.text;
    if (m.type === "joined") {
      myName = m.name;
      $("login").hidden = true;
      for (const id of ["top", "messages", "send"]) $(id).hidden = false;
      $("text").focus();
    }
    if (m.type === "history") m.messages.forEach(addMessage);
    if (m.type === "message") addMessage(m);
    if (m.type === "system") addSystem(m.text);
    if (m.type === "users") $("online").textContent = `Online: ${m.users.join(", ")}`;
  };

  ws.onclose = () => addSystem("Disconnected. Reload the page to reconnect.");

  $("login").onsubmit = (e) => {
    e.preventDefault();
    $("err").textContent = "";
    ws.send(JSON.stringify({ type: "join", name: $("name").value, password: $("password").value }));
  };

  $("send").onsubmit = (e) => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (!text) return;
    ws.send(JSON.stringify({ type: "message", text }));
    $("text").value = "";
  };

  function addMessage(m) {
    const div = document.createElement("div");
    div.className = "msg" + (m.name === myName ? " me" : "");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = m.name;
    const when = document.createElement("span");
    when.className = "when";
    when.textContent = new Date(m.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    who.append(when);
    const body = document.createElement("div");
    body.textContent = m.text; // textContent (not innerHTML) stops people injecting HTML
    div.append(who, body);
    push(div);
  }

  function addSystem(text) {
    const div = document.createElement("div");
    div.className = "sys";
    div.textContent = text;
    push(div);
  }

  function push(el) {
    const box = $("messages");
    box.append(el);
    box.scrollTop = box.scrollHeight;
  }
</script>
</body>
</html>
